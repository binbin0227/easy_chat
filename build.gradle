plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.1'
}

group = 'io.github.easychat'
version = '0.1.0'
base { archivesName = 'easy-chat-forge-1.8.9' }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
}
repositories { mavenCentral() }
unimined.useGlobalCache = false
unimined.minecraft {
    version '1.8.9'
    mappings {
        searge()
        mcp('stable', '22-1.8.9')
    }
    minecraftForge {
        loader '11.15.1.2318-1.8.9'
    }
}
dependencies {
    implementation files('work/libs/onnxruntime-1.17.3.jar')
    testImplementation 'junit:junit:4.13.2'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('mcmod.info') { expand version: project.version }
}
test {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
    systemProperty 'file.encoding', 'UTF-8'
}
jar {
    exclude 'easychat/whisper-bin-x64.zip', 'easychat/llama-cpu-x64.zip', 'easychat/llama-vulkan-x64.zip', 'assets/easychat/models/ggml-*.bin'
    exclude 'io/github/easychat/engine/WhisperEngine*.class', 'io/github/easychat/chat/GgufTranslator*.class', 'io/github/easychat/chat/QwenTranslator*.class'
    manifest { attributes('EasyChat-Build': '20261008-chat-clean', 'Implementation-Version': project.version) }
    from('LICENSE')
    from('THIRD_PARTY_NOTICES.md')
    from(zipTree('work/libs/onnxruntime-1.17.3.jar')) {
        include 'ai/onnxruntime/*.class', 'ai/onnxruntime/native/win-x64/*.dll'
    }
}
tasks.named('wrapper') {
    gradleVersion = '8.14'
    distributionSha256Sum = '61ad310d3c7d3e5da131b76bbf22b5a4c0786e9d892dae8c1658d4b484de3caa'
    networkTimeout = 60000
}
sourceSets {
    asrWorker {
        compileClasspath += files('work/libs/jna-5.17.0.jar')
    }
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }

}
tasks.register('paraformerWorkerJar', Jar) {
    dependsOn tasks.named('asrWorkerClasses')
    archiveFileName = 'paraformer-worker.jar'
    destinationDirectory = layout.buildDirectory.dir('asr-worker')
    from(sourceSets.asrWorker.output)
    from(zipTree('work/libs/jna-5.17.0.jar')) {
        include 'com/sun/jna/**/*.class', 'com/sun/jna/win32-x86-64/jnidispatch.dll'
    }
    from(tarTree(resources.bzip2('work/libs/sherpa-onnx-v1.13.8-win-x64-shared-MT-Release-no-tts-lib.tar.bz2'))) {
        include '**/lib/onnxruntime.dll', '**/lib/onnxruntime_providers_shared.dll', '**/lib/sherpa-onnx-c-api.dll'
        eachFile { path = 'easychat/native/win-x64/' + name }
        includeEmptyDirs = false
    }
    from('src/main/resources/licenses') { into 'licenses' }
    from('THIRD_PARTY_NOTICES.md')
    manifest { attributes('Main-Class': 'io.github.easychat.worker.ParaformerWorker') }
}
tasks.named('processResources') {
    dependsOn tasks.named('paraformerWorkerJar')
    from(tasks.named('paraformerWorkerJar').flatMap { it.archiveFile }) { into 'easychat' }
    exclude 'easychat/whisper-bin-x64.zip', 'easychat/llama-cpu-x64.zip', 'easychat/llama-vulkan-x64.zip'
}
